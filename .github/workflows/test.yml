name: Generate GitHub Stats

on:
  workflow_dispatch:
    inputs:
      username:
        description: GitHub username
        required: true
        type: string

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate stats
        run: python generate.py "${{ inputs.username }}"

      - name: Render SVG cards
        run: python render.py

      - name: Upload SVG cards
        uses: actions/upload-artifact@v4
        with:
          name: github-stats-${{ inputs.username }}
          path: output/*.svg
